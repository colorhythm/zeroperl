name: Request validated ExifTool release

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    dispatch:
        runs-on: ubuntu-24.04
        steps:
            -   name: Dispatch the package's validated release pipeline
                env:
                    GH_TOKEN: ${{ secrets.COLORHYTHM_PAT }}
                run: |
                    gh workflow run publish.yml --repo colorhythm/exiftool-wasm --ref main
